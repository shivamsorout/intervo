spring:
  application:
    name: intervo-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:intervo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-min-32-chars-long!!}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/callback}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MIN:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.intervo.api: INFO
